name: Exportar dados PC 392

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC (~03:00 horário de Brasília)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/export-pc392.yml"

permissions:
  contents: write

jobs:
  export-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar export
        env:
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
        run: python scripts/export_pc392.py

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pc392.json data/dominio_debug.json
          git diff --staged --quiet || git commit -m "Atualiza dados exportados [skip ci]"
          git pull --rebase
          git push
